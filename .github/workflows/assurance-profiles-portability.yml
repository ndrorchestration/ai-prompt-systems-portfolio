name: Assurance Profiles v0 portability probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-sha-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: "3.11"
      - name: Fetch exact Assurance Profiles candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .assurance-profiles-upstream
          curl -fsSL             https://raw.githubusercontent.com/ndrorchestration/DGAF-Framework/86120d604d9eb747a722c33a299898f79808f6ef/components/assurance_profiles.py             -o .assurance-profiles-upstream/assurance_profiles.py
          test -s .assurance-profiles-upstream/assurance_profiles.py
      - name: Run bounded second-system portability probe
        shell: bash
        run: |
          set -euo pipefail
          python governance/assurance_profiles_portability_probe.py             --upstream-core .assurance-profiles-upstream/assurance_profiles.py             --mapping specs/mappings/resumeapex_eval_common_model_v0.json             --consumer-sha "${{ github.event.pull_request.head.sha || github.sha }}"             --upstream-sha 86120d604d9eb747a722c33a299898f79808f6ef
