name: Governed Repo v0 portability probe

on:
  pull_request:
    branches: [main]
    paths:
      - "governance/governed_repo_portability_probe.py"
      - ".github/workflows/governed-repo-portability.yml"

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout exact Governed Repo P0 candidate
        uses: actions/checkout@v4
        with:
          repository: ndrorchestration/DGAF-Framework
          ref: 0a1bfc9fb9b02cae3351f3b22e4cb3220fc7fe11
          path: .governed-repo-upstream
          persist-credentials: false

      - name: Build pinned package candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade build
          python -m build .governed-repo-upstream/packages/governed-repo

      - name: Install built wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --force-reinstall             .governed-repo-upstream/packages/governed-repo/dist/*.whl

      - name: Run bounded installed-package portability cases
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          output="$(python "${GITHUB_WORKSPACE}/governance/governed_repo_portability_probe.py")"
          printf '%s\n' "$output"
          grep -Fq 'package_transport=wheel' <<<"$output"
          grep -Fq 'authority_transfer=false' <<<"$output"
          grep -Fq 'validation_transfer=false' <<<"$output"
