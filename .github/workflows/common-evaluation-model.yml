name: Common Evaluation Object Model

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate mapping JSON syntax
        run: |
          python -m json.tool specs/common_evaluation_object_model_v0.schema.json >/dev/null
          python -m json.tool specs/mappings/resumeapex_eval_common_model_v0.json >/dev/null
          python -m json.tool specs/mappings/driftwatch_common_model_v0.json >/dev/null
      - name: Validate common model mappings
        run: |
          python scripts/validate_common_evaluation_model.py \
            specs/mappings/resumeapex_eval_common_model_v0.json \
            specs/mappings/driftwatch_common_model_v0.json
      - name: Run common model tests
        run: python -m unittest tests.test_common_evaluation_model -v
